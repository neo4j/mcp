name: Docker Release

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["GoReleaser Release"]
    types: [completed]
    branches: [main]

permissions: {}

env:
  DOCKER_REPOSITORY: neo4j/mcp

jobs:
  get-version:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.output }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3
        with:
          version: latest
          args: latest

  build-and-push-docker:
    needs: get-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to DockerHub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.get-version.outputs.version }}
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ matrix.arch }}-${{ needs.get-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-manifests:
    needs: [get-version, build-and-push-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          docker buildx imagetools create \
            -t ${{ env.DOCKER_REPOSITORY }}:${VERSION} \
            -t ${{ env.DOCKER_REPOSITORY }}:latest \
            ${{ env.DOCKER_REPOSITORY }}:amd64-${VERSION} \
            ${{ env.DOCKER_REPOSITORY }}:arm64-${VERSION}
