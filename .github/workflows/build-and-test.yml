name: Neo4j MCP Server tests and linting

on:
  workflow_call:
    secrets:
      AURA_URL:
        required: true
      AURA_USERNAME:
        required: true
      AURA_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  check-runner:
    name: Check Runner Permissions
    runs-on: ubuntu-latest
    outputs:
      use-container: ${{ steps.check.outputs.use-container }}
    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - id: check
        run: |
          # Use container only for fork PRs (when we don't have access to secrets)
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "use-container=true" >> "$GITHUB_OUTPUT"
          else
            echo "use-container=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-unit-test:
    name: Lint and Unit Test
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
      - run: go install go.uber.org/mock/mockgen@latest

      - name: Download dependencies
        run: go mod download

      - name: Generate mocks
        run: go generate ./...

      - name: Verify mocks are up-to-date
        run: |
          git diff --exit-code || (echo "Generated mocks are not up-to-date. Please run 'go generate ./...' locally and push the updated files." && exit 1)

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=1m

      - name: Run unit tests
        run: go test -v -race ./...

  integration-tests-ubuntu:
    name: Integration Tests (ubuntu-latest)
    needs: check-runner
    runs-on: ubuntu-latest

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./test/integration/...
        env:
          USE_CONTAINER: ${{ needs.check-runner.outputs.use-container }}
          NEO4J_URI: ${{ secrets.AURA_URL }}
          NEO4J_USERNAME: ${{ secrets.AURA_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.AURA_PASSWORD }}

  integration-tests-other:
    name: Integration Tests
    needs: check-runner
    if: needs.check-runner.outputs.use-container != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/emudhra-cs"; rm -rf "$d"; mkdir -p "$d"
          awk -v d="$d" '
            /-----BEGIN CERTIFICATE-----/ {n++; out=1}
            out {print > (d "/" n ".pem")}
            /-----END CERTIFICATE-----/ {out=0}
          ' /etc/ssl/cert.pem
          : > "$d/new.pem"
          removed=0
          for f in "$d"/[0-9]*.pem; do
            subj=$(openssl x509 -noout -subject -in "$f" 2>/dev/null || true)
            if echo "$subj" | grep -qiE 'AAA Certificate Services|emSign ECC Root CA - G3'; then
              echo "Removing: $subj"; removed=$((removed+1))
            else
              cat "$f" >> "$d/new.pem"
            fi
          done
          echo "Removed $removed certificate(s) from /etc/ssl/cert.pem"
          sudo cp "$d/new.pem" /etc/ssl/cert.pem

      - name: Patch eMudhra CA compromise (CVE-2026-111943) - advisory list
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $list = Invoke-RestMethod -Uri 'https://emudhra.we-have-a-problem.com/impacted-intermediates.json'
          $i = 0
          foreach ($c in $list) {
            if ($c.subject -notmatch 'eMudhra|emSign') { Write-Host "Skipping unexpected entry: $($c.subject)"; continue }
            $i++
            $f = Join-Path $env:RUNNER_TEMP "emudhra_$i.pem"
            Set-Content -Path $f -Value $c.pem -Encoding ascii
            certutil.exe -addstore -f Disallowed $f | Out-Null
          }
          Write-Host "Disallowed $i certificate(s) from the advisory list"
          $global:LASTEXITCODE = 0

      - name: Patch eMudhra CA compromise - cross-signed emSign Root TLS CA - G3 (missing from advisory list)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b64 = ''
          $f = Join-Path $env:RUNNER_TEMP 'cross_signed_root_tls_g3.cer'
          [System.IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($b64))
          certutil.exe -addstore -f Disallowed $f
          $global:LASTEXITCODE = 0

      - name: Wait for the Windows trust change to take effect
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 60

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./test/integration/...
        env:
          USE_CONTAINER: "false"
          NEO4J_URI: ${{ secrets.AURA_URL }}
          NEO4J_USERNAME: ${{ secrets.AURA_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.AURA_PASSWORD }}

  e2e-tests-ubuntu:
    name: E2E Tests (ubuntu-latest)
    needs: check-runner
    runs-on: ubuntu-latest

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run E2E tests
        run: go test -v -tags=e2e ./test/e2e/...
        env:
          USE_CONTAINER: ${{ needs.check-runner.outputs.use-container }}
          NEO4J_URI: ${{ secrets.AURA_URL }}
          NEO4J_USERNAME: ${{ secrets.AURA_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.AURA_PASSWORD }}

  e2e-tests-other:
    name: E2E Tests
    needs: check-runner
    if: needs.check-runner.outputs.use-container != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/emudhra-cs"; rm -rf "$d"; mkdir -p "$d"
          awk -v d="$d" '
            /-----BEGIN CERTIFICATE-----/ {n++; out=1}
            out {print > (d "/" n ".pem")}
            /-----END CERTIFICATE-----/ {out=0}
          ' /etc/ssl/cert.pem
          : > "$d/new.pem"
          removed=0
          for f in "$d"/[0-9]*.pem; do
            subj=$(openssl x509 -noout -subject -in "$f" 2>/dev/null || true)
            if echo "$subj" | grep -qiE 'AAA Certificate Services|emSign ECC Root CA - G3'; then
              echo "Removing: $subj"; removed=$((removed+1))
            else
              cat "$f" >> "$d/new.pem"
            fi
          done
          echo "Removed $removed certificate(s) from /etc/ssl/cert.pem"
          sudo cp "$d/new.pem" /etc/ssl/cert.pem

      - name: Patch eMudhra CA compromise (CVE-2026-111943) - advisory list
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $list = Invoke-RestMethod -Uri 'https://emudhra.we-have-a-problem.com/impacted-intermediates.json'
          $i = 0
          foreach ($c in $list) {
            if ($c.subject -notmatch 'eMudhra|emSign') { Write-Host "Skipping unexpected entry: $($c.subject)"; continue }
            $i++
            $f = Join-Path $env:RUNNER_TEMP "emudhra_$i.pem"
            Set-Content -Path $f -Value $c.pem -Encoding ascii
            certutil.exe -addstore -f Disallowed $f | Out-Null
          }
          Write-Host "Disallowed $i certificate(s) from the advisory list"
          $global:LASTEXITCODE = 0

      - name: Patch eMudhra CA compromise - cross-signed emSign Root TLS CA - G3 (missing from advisory list)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b64 = ''
          $f = Join-Path $env:RUNNER_TEMP 'cross_signed_root_tls_g3.cer'
          [System.IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($b64))
          certutil.exe -addstore -f Disallowed $f
          $global:LASTEXITCODE = 0

      - name: Wait for the Windows trust change to take effect
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 60

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run E2E tests
        run: go test -v -tags=e2e ./test/e2e/...
        env:
          USE_CONTAINER: "false"
          NEO4J_URI: ${{ secrets.AURA_URL }}
          NEO4J_USERNAME: ${{ secrets.AURA_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.AURA_PASSWORD }}
