name: License

on:
  workflow_call:

permissions:
  contents: read

jobs:
  license-header-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
      - name: Install addlicense
        run: go install github.com/google/addlicense@b289835c0741ba2fb92dd5f61af070e79c69a55e # v1.2
      - name: Run addlicense
        run: addlicense -f ./addlicense -check $(find . -name "*.go" -type f -print0 | xargs -0)
