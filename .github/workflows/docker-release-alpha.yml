name: Docker Release Alpha
description: This workflow is not to be ran on the main branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name (e.g. v1.2.3)"
        required: true
        type: string

env:
  DOCKER_REPOSITORY: neo4j/mcp

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
